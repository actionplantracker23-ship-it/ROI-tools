<style>

:root {

  --critique: #a23b2a; --critique-fond: #f6dcd6;
  --ombre: 0 1px 3px rgba(23, 73, 122, .10), 0 4px 14px rgba(23, 73, 122, .07);
  --f-titre: "Space Grotesk", "Segoe UI", Roboto, sans-serif;
  --f-texte: "Inter", Roboto, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bleu: #6fa8de; --bleu-fonce: #1b3a5a; --orange: #f08a45;
  --fond: #0f161d; --surface: #18222c; --surface-2: #1f2b37; --ligne: #2c3a47;
  --texte: #e4ebf1; --texte-2: #9aabb9; --sur-bleu: #0f161d; --cadre: #2a3642;
  --ok: #6cc79a; --ok-fond: #183528; --alerte: #f0b05e; --alerte-fond: #3a2b14;
  --critique: #f08a7a; --critique-fond: #3d1f1a; --ombre: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bleu: #6fa8de; --bleu-fonce: #1b3a5a; --orange: #f08a45;
  --fond: #0f161d; --surface: #18222c; --surface-2: #1f2b37; --ligne: #2c3a47;
  --texte: #e4ebf1; --texte-2: #9aabb9; --sur-bleu: #0f161d; --cadre: #2a3642;
  --ok: #6cc79a; --ok-fond: #183528; --alerte: #f0b05e; --alerte-fond: #3a2b14;
  --critique: #f08a7a; --critique-fond: #3d1f1a; --ombre: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }

* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.telephone { height: 100%; display: flex; flex-direction: column; background: var(--fond); overflow: hidden; position: relative; }
@media (min-width: 560px) {
  body { display: flex; align-items: center; justify-content: center; padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .telephone { width: 412px; height: min(880px, 100%); border-radius: 30px; border: 8px solid #1c2833; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
}

.barre { background: var(--bleu-fonce); color: #fff; padding-block: 12px 14px; flex: none; }

.p-ok { background: var(--ok-fond); color: var(--ok); }

/* Formulaire */

.groupe-titre { font-family: var(--f-titre); font-weight: 600; color: var(--bleu); font-size: 15.5px; margin-top: 8px; padding-bottom: 6px; border-bottom: 2px solid color-mix(in srgb, var(--bleu) 25%, transparent); text-wrap: balance; }
.groupe .groupe .groupe-titre { font-size: 14.5px; color: var(--texte); border-bottom-width: 1px; }
.champ { background: var(--surface); border-radius: 14px; box-shadow: var(--ombre); padding: 14px 16px; }
.champ .q { font-weight: 600; display: block; margin-bottom: 10px; overflow-wrap: anywhere; }

.champ input[type=text], .champ input[type=number], .champ input[type=date], .champ select, .champ textarea {

.champ select { appearance: auto; }

.gps { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.resultat { border-radius: 16px; padding: 18px; color: #fff; background: var(--bleu-fonce); }

.toast { position: absolute; left: 16px; right: 16px; bottom: 80px; background: var(--texte); color: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 8; }

.feuille .panneau { background: var(--surface); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
.feuille h3 { font-family: var(--f-titre); margin: 0 0 6px; font-size: 18px; }
.feuille .actions { display: flex; gap: 10px; margin-top: 16px; }
.feuille .actions .btn { flex: 1; }
.sommaire button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 4px; border-top: 1px solid var(--ligne); }
.sommaire button.courant { color: var(--bleu); font-weight: 600; }
.sommaire .num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
.sommaire .num.err { background: var(--critique-fond); color: var(--critique); }
.sommaire .petit { font-size: 11.5px; color: var(--texte-2); font-weight: 400; display: block; }
pre.json { background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 11.5px; overflow: auto; max-height: 50vh; white-space: pre; }
.vide { text-align: center; color: var(--texte-2); padding: 26px 10px; font-size: 14px; }
.filtres { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; flex: none; }
.filtres button { border: 1.5px solid var(--ligne); background: var(--surface); border-radius: 18px; padding: 6px 14px; font-size: 13px; white-space: nowrap; }
.filtres button.sel { background: var(--bleu); color: var(--sur-bleu); border-color: var(--bleu); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }

.anomalie code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

<script>
const FORM = /*FORMULAIRE*/null;

/* =======================================================================
   1. Lecture du XLSForm : arbre des groupes, répétitions et questions
   ======================================================================= */
const racine = { kind: "root", children: [], name: "" };
const CHAMPS = {};          // name -> noeud
const DANS_REPET = {};      // name -> nom de la répétition qui le contient
(function construire() {
  const pile = [racine];
  for (const r of FORM.survey) {
    const [base, liste] = r.type.trim().split(/\s+/);
    const parent = pile[pile.length - 1];
    if (base === "end_group" || base === "end_repeat") { if (pile.length > 1) pile.pop(); continue; }
    const n = { ...r, base, liste, parent, children: [] };
    if (base === "begin_group" || base === "begin_repeat") { n.kind = base === "begin_group" ? "group" : "repeat"; parent.children.push(n); pile.push(n); }
    else { n.kind = "field"; parent.children.push(n); }
    if (n.name) CHAMPS[n.name] = n;
    const rep = pile.slice(0, n.kind === "field" ? undefined : -1).reverse().find(p => p.kind === "repeat");
    if (rep && n.kind === "field") DANS_REPET[n.name] = rep.name;
  }
})();
const CHOIX_INDEX = {};
for (const [k, l] of Object.entries(FORM.choices)) CHOIX_INDEX[k] = Object.fromEntries(l.map(c => [c[0], c[1]]));

/* =======================================================================
   2. Évaluateur des expressions XLSForm (sous-ensemble XPath d'ODK)
   ======================================================================= */
function tokens(s) {
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === "$" && s[i + 1] === "{") { const j = s.indexOf("}", i); t.push({ k: "ref", v: s.slice(i + 2, j) }); i = j + 1; continue; }
    if (c === "'" || c === '"' || c === "’" || c === "‘") { const fin = c === "‘" ? "’" : c; const j = s.indexOf(fin, i + 1); t.push({ k: "str", v: s.slice(i + 1, j) }); i = j + 1; continue; }
    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i + 1] || ""))) { const m = s.slice(i).match(/^[0-9]*\.?[0-9]+/); t.push({ k: "num", v: +m[0] }); i += m[0].length; continue; }
    if (s.startsWith("..", i)) { t.push({ k: "parentdot" }); i += 2; continue; }
    if (c === ".") { t.push({ k: "dot" }); i++; continue; }
    const op = ["!=", "<=", ">=", "=", "<", ">", "+", "-", "*", "(", ")", ","].find(o => s.startsWith(o, i));
    if (op) { t.push({ k: "op", v: op }); i += op.length; continue; }
    const m = s.slice(i).match(/^[A-Za-z_][\w\-:]*/);
    if (m) { t.push({ k: "id", v: m[0] }); i += m[0].length; continue; }
    throw new Error("Caractère inattendu « " + c + " »");
  }
  return t;
}
const estVide = v => v === undefined || v === null || v === "" || (typeof v === "number" && isNaN(v));
const num = v => Array.isArray(v) ? num(v[0]) : (v === "" || v == null ? NaN : typeof v === "boolean" ? +v : Number(v));
const bool = v => Array.isArray(v) ? v.length > 0 : typeof v === "boolean" ? v : typeof v === "number" ? !isNaN(v) && v !== 0 : !!v;
const str = v => Array.isArray(v) ? str(v[0]) : v == null ? "" : typeof v === "number" ? (isNaN(v) ? "NaN" : String(+v.toFixed(10))) : typeof v === "boolean" ? String(v) : String(v);
function compare(a, b, op) {
  if (Array.isArray(a)) return a.some(x => compare(x, b, op));
  if (Array.isArray(b)) return b.some(x => compare(a, x, op));
  if (op === "=" || op === "!=") {
    let eq;
    if (typeof a === "boolean" || typeof b === "boolean") eq = bool(a) === bool(b);
    else if (typeof a === "number" || typeof b === "number") eq = num(a) === num(b);
    else eq = str(a) === str(b);
    return op === "=" ? eq : !eq;
  }
  const x = num(a), y = num(b);
  return op === "<" ? x < y : op === "<=" ? x <= y : op === ">" ? x > y : x >= y;
}
const FONCTIONS = {
  "if": (c, a, b) => bool(c) ? a : b,
  "selected": (a, b) => str(a).split(/\s+/).includes(str(b)),
  "count-selected": a => str(a).split(/\s+/).filter(Boolean).length,
  "not": a => !bool(a), "true": () => true, "false": () => false,
  "round": (a, d = 0) => { const f = Math.pow(10, num(d)); return Math.round(num(a) * f) / f; },
  "int": a => Math.trunc(num(a)), "number": a => num(a), "string": a => str(a),
  "sum": a => (Array.isArray(a) ? a : [a]).reduce((s, x) => s + (estVide(x) ? 0 : num(x)), 0),
  "count": a => Array.isArray(a) ? a.length : (estVide(a) ? 0 : 1),

function blocResultat(r) {

function voirJson(i) {

function soumission(i) {
  const sauv = inst; inst = JSON.parse(JSON.stringify(i)); recalculer();
  const out = {};
  const chemin = n => { const p = []; let x = n.parent; while (x && x.kind !== "root") { if (x.kind !== "repeat") p.unshift(x.name); x = x.parent; } return p; };
  const ecrireCh = (n, v, base) => { if (estVide(v)) return; base[[...chemin(n), n.name].join("/")] = v; };
  const parcourir = (noeuds) => noeuds.forEach(n => {
    if (n.kind === "group") return parcourir(n.children);
    if (n.kind === "repeat") { out[n.name] = (inst.repets[n.name] || []).map((r, i) => { const o = {}; n.children.forEach(c => { if (c.kind === "field" && pertinent[cle(c.name, i)] !== false && c.base !== "note") ecrireCh(c, r[c.name], o); }); return o; }); return; }
    if (n.base === "note" || pertinent[n.name] === false) return;
    if (n.base === "draw" || n.appearance === "draw") return ecrireCh(n, inst.valeurs[n.name] ? "signature.png" : "", out);

}

/* ---------- Saisie ---------- */
function nouvelle() {
  inst = { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), valeurs: { start: new Date().toISOString() }, repets: {} };
  page = 0; erreurs = {}; onglet = "form"; recalculer(); rendre();
}
function resume() {
  const v = inst.valeurs, lab = (n, c) => (CHOIX_INDEX[CHAMPS[n]?.liste] || {})[c] || "";
  const sections = [];
  const pc = (n, label) => { if (!estVide(v[n]) && pertinent[n] !== false) sections.push([label, +v[n]]); };
  const ch = String(v.supervision_choisie || "").split(" ");
  if (ch.includes("prise_en_charge")) pc("pct_global_pcime", "Prise en charge (PCIME)");

  };
}
function enregistrerBrouillon() {

  if (f) Object.assign(f, donnees); else fiches.unshift(donnees);

}

function ecranForm() {

    sourcil: pg.sourcil, gauche: `<button class="icone-btn" id="quitter" aria-label="Fermer la fiche"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`,
    droite: pct != null ? `<div class="puce-score"><b>${pct} %</b>score global</div>` : `<button class="reseau ${enLigne ? "" : "hors"}" id="btn-reseau"><span class="point"></span>${enLigne ? "En ligne" : "Hors ligne"}</button>`,
    progression: `<div class="progression">${pages.map((_, i) => `<i class="${i < page ? "fait" : i === page ? "encours" : ""}"></i>`).join("")}</div>` });
  $("#quitter").onclick = () => feuille(`<h3>Quitter la fiche ?</h3><div class="indice">Vous pouvez la garder en brouillon et la reprendre plus tard.</div>
    <div class="actions"><button class="btn btn-contour" id="jeter">Abandonner</button><button class="btn btn-bleu" id="garder">Garder en brouillon</button></div>`, () => {

    ${page > 0 ? `<button class="btn btn-contour" id="prec">Précédent</button>` : ""}<button class="btn ${dernier ? "btn-plein" : "btn-bleu"}" id="suiv">${dernier ? "Finaliser" : "Suivant"}</button></div>`;

let derniereSig = "";
function signaturePage(pg) {
  const out = [];
  const marcher = (noeuds, idx) => noeuds.forEach(n => {
    if (!noeudVisible(n)) return;
    if (n.kind === "group") { if (idx == null || pertinent[cle(n.name, idx)] !== false) marcher(n.children, idx); return; }
    if (n.kind === "repeat") { const l = inst.repets[n.name] || []; out.push(n.name + ":" + l.length); l.forEach((_, i) => marcher(n.children, i)); return; }
    const k = cle(n.name, idx);
    if (pertinent[k] === false) return;
    out.push(k);
    if (n.choice_filter) out.push(choixFiltres(n, idx).length);
  });
  marcher(pg.noeuds, null);
  return out.join("|") + "/" + Object.keys(erreurs).join("|");
}
function dessinerPage(pg) {
  const y = $("#ecran").scrollTop;
  const actif = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  $("#ecran").innerHTML = pg.noeuds.map(n => html(n, null, pg.sansTitre)).join("");
  brancher();
  $("#ecran").scrollTop = y;
  derniereSig = signaturePage(pg);
  if (actif) { const el = $(`#ecran input[data-k="${actif}"]:not([type=checkbox]), #ecran textarea[data-k="${actif}"]`); if (el) el.focus({ preventScroll: true }); }
}
function majNotes() {
  document.querySelectorAll("#ecran [data-note]").forEach(el => {
    const [nom, i] = el.dataset.note.split("#");
    el.innerHTML = esc(interpoler(CHAMPS[nom].label, i == null ? null : +i)).replace(/\s{2,}\|\s{2,}|[\u2028\u2029\r\n]+/g, "<br>").replace(/\s*[\uf000-\uf0ff]\s*/g, "<br>• ");
  });
}
const pageCourante = () => pagesActives()[page];
// Redessine l'écran seulement si les questions visibles ont changé ; sinon met à jour les scores en place.
function rafraichir() {
  recalculer();
  const pg = pageCourante();
  if (signaturePage(pg) === derniereSig) majNotes(); else dessinerPage(pg);
  majPuce();
}
function majPuce() {
  const p = $(".puce-score b"); const v = inst.valeurs.pct_global_total;
  if (p && !estVide(v)) p.textContent = v + " %";
}

function html(n, idx, sansTitre) {
  if (!noeudVisible(n)) return "";
  if (n.kind === "field" && pertinent[cle(n.name, idx)] === false) return "";
  if (n.kind === "group") {
    if (idx != null && pertinent[cle(n.name, idx)] === false) return "";
    const enfants = n.children.map(c => html(c, idx)).join("");
    if (!enfants) return "";
    return `<section class="groupe">${!sansTitre && n.label ? `<div class="groupe-titre">${esc(interpoler(n.label, idx))}</div>` : ""}${enfants}</section>`;
  }
  if (n.kind === "repeat") {
    const l = inst.repets[n.name] || [{}];
    return `<section class="groupe">${!sansTitre ? `<div class="groupe-titre">${esc(n.label)}</div>` : ""}
      ${l.map((_, i) => `<div class="repet"><div class="repet-entete"><span>${esc(n.label.replace(/^\d+\.\s*/, "").slice(0, 34))}${n.label.length > 34 ? "…" : ""} · n° ${i + 1}</span>${l.length > 1 ? `<button class="btn btn-contour btn-petit" data-suppr="${n.name}" data-i="${i}">Retirer</button>` : ""}</div>${n.children.map(c => html(c, i)).join("")}</div>`).join("")}
      <button class="btn btn-contour btn-large" data-ajout="${n.name}">+ Ajouter ${n.name === "groupe_enfants" ? "un enfant" : "une ligne"}</button></section>`;
  }
  return champ(n, idx);
}

function choixFiltres(n, idx) {
  const liste = FORM.choices[n.liste] || [];
  if (!n.choice_filter) return liste;
  const base = contexte(idx);
  return liste.filter(c => bool(evaluer(n.choice_filter, { ...base, attribut: a => a === "name" ? c[0] : a === "label" ? c[1] : a === "parent" ? (c[2] || "") : "" })));
}

function champ(n, idx) {
  const k = cle(n.name, idx), v = DANS_REPET[n.name] ? brut(n.name, idx) : inst.valeurs[n.name];
  const lab = interpoler(n.label || "", idx);
  if (n.base === "note") {
    const estScore = /score|performance/i.test(lab);
    return `<div class="note ${estScore ? "score-note" : ""}" data-note="${k}">${esc(lab).replace(/\s{2,}\|\s{2,}|[\u2028\u2029\r\n]+/g, "<br>").replace(/\s*[\uf000-\uf0ff]\s*/g, "<br>• ")}</div>`;
  }
  const err = erreurs[k];
  const q = `<span class="q">${esc(lab)}${n.required ? ' <span class="req">*</span>' : ""}</span>${n.hint ? `<div class="indice" style="margin:-6px 0 8px">${esc(n.hint)}</div>` : ""}`;
  const fin = err ? `<div class="msg-erreur">${esc(err)}</div>` : "";
  const id = "f-" + k.replace("#", "-");
  let corps = "";
  const d = `data-k="${k}"`;
  switch (n.base) {
    case "select_one": {
      const ch = choixFiltres(n, idx);
      if (n.appearance === "minimal" || ch.length > 6) {
        corps = `<select id="${id}" ${d}><option value="">${ch.length ? "Choisir…" : "Choisissez d'abord la question précédente"}</option>${ch.map(c => `<option value="${esc(c[0])}" ${v === c[0] ? "selected" : ""}>${esc(c[1])}</option>`).join("")}</select>`;
      } else corps = `<div class="choix" role="radiogroup">${ch.map(c => `<button type="button" role="radio" aria-checked="${v === c[0]}" ${d} data-v="${esc(c[0])}" class="${v === c[0] ? "sel" : ""}">${esc(c[1])}</button>`).join("")}</div>`;
      break;
    }
    case "select_multiple": {
      const sel = String(v || "").split(" ").filter(Boolean);
      corps = `<div class="cases">${choixFiltres(n, idx).map(c => `<label><input type="checkbox" ${d} data-v="${esc(c[0])}" ${sel.includes(c[0]) ? "checked" : ""}><span>${esc(c[1])}</span></label>`).join("")}</div>`;
      break;
    }
    case "integer": case "decimal": corps = `<input type="number" inputmode="${n.base === "integer" ? "numeric" : "decimal"}" id="${id}" ${d} value="${esc(v)}">`; break;
    case "date": corps = `<input type="date" id="${id}" ${d} value="${esc(v)}">`; break;
    case "geopoint": corps = `<div class="gps"><button type="button" class="btn btn-contour" data-gps="${k}">${v ? "Reprendre la position" : "Capturer la position"}</button>${v ? `<code>${esc(v)}</code>` : ""}</div>`; break;
    case "text":
      if (n.appearance === "draw") corps = `<canvas class="signature" data-sig="${k}"></canvas><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="indice">Signez avec le doigt.</span><button type="button" class="btn btn-contour btn-petit" data-effacer="${k}">Effacer</button></div>`;
      else if (n.appearance === "multiline") corps = `<textarea id="${id}" ${d}>${esc(v)}</textarea>`;
      else corps = `<input type="text" id="${id}" ${d} value="${esc(v)}">`;
      break;
    case "draw": corps = `<canvas class="signature" data-sig="${k}"></canvas>`; break;
    default: corps = `<input type="text" id="${id}" ${d} value="${esc(v)}">`;
  }
  return `<div class="champ ${err ? "erreur" : ""}" id="c-${k.replace("#", "-")}">${["integer", "decimal", "date", "text"].includes(n.base) && n.appearance !== "draw" ? `<label class="q" for="${id}">${esc(lab)}${n.required ? ' <span class="req">*</span>' : ""}</label>` : q}${corps}${fin}</div>`;
}

function poser(k, v) {
  const [nom, i] = k.split("#");
  if (i != null) { const r = DANS_REPET[nom]; inst.repets[r][+i][nom] = v; } else inst.valeurs[nom] = v;
  delete erreurs[k];
  // listes en cascade : vider les questions qui dépendent de celle-ci
  for (const n of Object.values(CHAMPS)) if (n.choice_filter && n.choice_filter.includes("${" + nom + "}") && !DANS_REPET[n.name]) {
    const ok = choixFiltres(n, null).some(c => c[0] === inst.valeurs[n.name]); if (!ok && inst.valeurs[n.name]) poser(n.name, "");
  }
}
const valeur = k => { const [nom, i] = k.split("#"); return i != null ? brut(nom, +i) : inst.valeurs[nom]; };

function brancher() {
  const e = $("#ecran");
  e.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; poser(k, valeur(k) === b.dataset.v ? "" : b.dataset.v); rafraichir(); });
  e.querySelectorAll("select[data-k]").forEach(s => s.onchange = () => { poser(s.dataset.k, s.value); rafraichir(); });
  e.querySelectorAll("input[type=checkbox][data-k]").forEach(c => c.onchange = () => {
    const k = c.dataset.k; let l = String(valeur(k) || "").split(" ").filter(Boolean);
    l = c.checked ? [...l, c.dataset.v] : l.filter(x => x !== c.dataset.v);
    poser(k, l.join(" ")); rafraichir();
  });
  e.querySelectorAll("input[type=number][data-k], input[type=text][data-k], input[type=date][data-k], textarea[data-k]").forEach(el => {
    el.oninput = () => { poser(el.dataset.k, el.value); recalculer(); majPuce(); };
    el.onchange = () => { poser(el.dataset.k, el.value); setTimeout(rafraichir, 0); };
  });
  e.querySelectorAll("[data-ajout]").forEach(b => b.onclick = () => { inst.repets[b.dataset.ajout].push({}); rafraichir(); });
  e.querySelectorAll("[data-suppr]").forEach(b => b.onclick = () => { inst.repets[b.dataset.suppr].splice(+b.dataset.i, 1); erreurs = {}; rafraichir(); });
  e.querySelectorAll("[data-gps]").forEach(b => b.onclick = () => {
    const fixer = (lat, lon, acc, simule) => { poser(b.dataset.gps, `${lat.toFixed(6)} ${lon.toFixed(6)} 0 ${Math.round(acc)}`); rafraichir(); if (simule) toast("Position simulée : le GPS n'est pas accessible dans cet aperçu."); };
    const simuler = () => fixer(11.95 + Math.random() * .05, -3.75 + Math.random() * .05, 8, true);
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => fixer(p.coords.latitude, p.coords.longitude, p.coords.accuracy), simuler, { timeout: 4000 });
    else simuler();
  });
  e.querySelectorAll("[data-sig]").forEach(signature);
}

function signature(cv) {
  const k = cv.dataset.sig, ctx = cv.getContext("2d"), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = getComputedStyle(document.body).color;
  const v = valeur(k); if (v) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = v; }
  let actif = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { actif = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  cv.onpointermove = e => { if (actif) { ctx.lineTo(...pos(e)); ctx.stroke(); } };
  cv.onpointerup = () => { actif = false; poser(k, cv.toDataURL()); };
  const eff = document.querySelector(`[data-effacer="${k}"]`);
  if (eff) eff.onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); poser(k, ""); };
}

/* ---------- Contrôles : obligatoire et contraintes ---------- */
function erreursNoeuds(noeuds, idx, out) {
  for (const n of noeuds) {
    if (n.kind === "group") { if (pertinent[cle(n.name, idx)] !== false) erreursNoeuds(n.children, idx, out); continue; }
    if (n.kind === "repeat") { if (pertinent[n.name] !== false) (inst.repets[n.name] || []).forEach((_, i) => erreursNoeuds(n.children, i, out)); continue; }
    if (["note", "calculate", "start", "end"].includes(n.base)) continue;
    const k = cle(n.name, idx);
    if (pertinent[k] === false) continue;
    const v = valeur(k);
    if (n.required && estVide(v)) { out[k] = "Réponse obligatoire."; continue; }
    if (n.constraint && !estVide(v)) {
      const ok = bool(evaluer(n.constraint, contexte(idx, valeurTypee(n, v))));
      if (!ok) out[k] = n.constraint_message || "Réponse non valide.";
    }
  }
  return out;
}
function validerPage(pg) {
  recalculer();
  erreurs = erreursNoeuds(pg.noeuds, null, {});
  const n = Object.keys(erreurs).length;
  if (!n) return true;
  dessinerPage(pg);
  const premier = $("#ecran .champ.erreur"); if (premier) premier.scrollIntoView({ behavior: "smooth", block: "center" });
  toast(n + (n > 1 ? " questions demandent" : " question demande") + " une correction.");
  return false;
}
function sommaire() {
  recalculer();
  const pages = pagesActives();
  feuille(`<h3>Sommaire de la fiche</h3><div class="sommaire">${pages.map((p, i) => {
    const nErr = Object.keys(erreursNoeuds(p.noeuds, null, {})).length;
    return `<button data-aller="${i}" class="${i === page ? "courant" : ""}"><span class="num ${nErr && i < page ? "err" : ""}">${i + 1}</span><span style="flex:1;min-width:0">${esc(interpoler(p.titre))}${p.sourcil ? `<span class="petit">${esc(p.sourcil)}</span>` : ""}</span>${nErr ? `<span class="pastille p-neutre">${nErr} à remplir</span>` : `<span class="pastille p-ok">OK</span>`}</button>`;
  }).join("")}</div>`, () => document.querySelectorAll("[data-aller]").forEach(b => b.onclick = () => { page = +b.dataset.aller; erreurs = {}; fermer(); rendre(); }));
}
function finaliser() {
  recalculer();
  const pages = pagesActives();
  for (let i = 0; i < pages.length; i++) {
    const e = erreursNoeuds(pages[i].noeuds, null, {});
    if (Object.keys(e).length) { page = i; erreurs = e; rendre(); const p = $("#ecran .champ.erreur"); if (p) p.scrollIntoView({ block: "center" }); toast("Écran « " + pages[i].titre.slice(0, 40) + " » incomplet."); return; }
  }
  inst.valeurs.end = new Date().toISOString();
  recalculer();
  const r = resume();
  const f = fiches.find(x => x.id === inst.id);
  const plan = (inst.repets.group_fr4gh16 || []).map(x => ({ ...x }));
  const donnees = { id: inst.id, statut: "attente", inst: JSON.parse(JSON.stringify(inst)), resume: r, plan };
  if (f) Object.assign(f, donnees); else fiches.unshift(donnees);
  sauver();
  inst = null; onglet = "accueil"; rendre();
  feuille(`<h3>Fiche finalisée</h3><div class="indice">${esc(r.asbc)} · ${enLigne ? "prête à être envoyée." : "gardée sur le téléphone jusqu'au retour du réseau."}</div>${blocResultat(r)}
    <div class="actions"><button class="btn btn-contour" data-fermer>Plus tard</button><button class="btn btn-bleu" id="env">Envoyer</button></div>`, () => { $("#env").onclick = () => { fermer(); envoyer(); }; });
}

/* ---------- Envoi (simulé) ---------- */
function envoyer() {
  const n = fiches.filter(f => f.statut === "attente").length;
  if (!n) return;
  if (!enLigne) { toast("Pas de réseau : " + n + " fiche" + (n > 1 ? "s seront envoyées" : " sera envoyée") + " au retour du réseau."); return; }
  feuille(`<h3>Envoi au serveur</h3><div class="indice">Envoi de ${n} fiche${n > 1 ? "s" : ""}…</div><div style="height:8px;background:var(--surface-2);border-radius:4px;margin-top:14px;overflow:hidden"><i id="pb" style="display:block;height:100%;width:0;background:var(--orange);transition:width .25s"></i></div>`, null, false);
  let p = 0; const t = setInterval(() => { p += 20; const el = $("#pb"); if (el) el.style.width = p + "%";
    if (p >= 100) { clearInterval(t); fiches.forEach(f => { if (f.statut === "attente") f.statut = "envoyee"; }); sauver(); fermer(); toast(n + (n > 1 ? " fiches envoyées." : " fiche envoyée.")); rendre(); } }, 250);
}

/* ---------- Feuilles et messages ---------- */
function feuille(contenu, apres, fermable = true) {
  $("#couche").innerHTML = `<div class="feuille" id="f"><div class="panneau gouttiere">${contenu}</div></div>`;
  if (fermable) $("#f").onclick = e => { if (e.target.id === "f" || e.target.closest("[data-fermer]")) fermer(); };
  if (apres) apres();
}
function fermer() { $("#couche").innerHTML = ""; }
let minuteur;
function toast(t) {
  clearTimeout(minuteur); document.querySelectorAll(".toast").forEach(x => x.remove());
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
  $("#tel").appendChild(d); minuteur = setTimeout(() => d.remove(), 3500);
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { onglet = b.dataset.onglet; rendre(); });
// Compile toutes les expressions une fois pour signaler celles que le moteur ne sait pas lire.
FORM.survey.forEach(r => ["relevant", "calculation", "constraint", "choice_filter"].forEach(k => { if (r[k]) evaluer(r[k], { lire: () => "", attribut: () => "" }); }));
rendre();
</script>
