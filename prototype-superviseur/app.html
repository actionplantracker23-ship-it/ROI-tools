<script>
const FORM = /*FORMULAIRE*/null;

/* =======================================================================
   1. Lecture du XLSForm : arbre des groupes, répétitions et questions
   ======================================================================= */
const racine = { kind: "root", children: [], name: "" };
const CHAMPS = {};          // name -> noeud
const DANS_REPET = {};      // name -> nom de la répétition qui le contient
(function construire() {
  const pile = [racine];
  for (const r of FORM.survey) {
    const [base, liste] = r.type.trim().split(/\s+/);
    const parent = pile[pile.length - 1];
    if (base === "end_group" || base === "end_repeat") { if (pile.length > 1) pile.pop(); continue; }
    const n = { ...r, base, liste, parent, children: [] };
    if (base === "begin_group" || base === "begin_repeat") { n.kind = base === "begin_group" ? "group" : "repeat"; parent.children.push(n); pile.push(n); }
    else { n.kind = "field"; parent.children.push(n); }
    if (n.name) CHAMPS[n.name] = n;
    const rep = pile.slice(0, n.kind === "field" ? undefined : -1).reverse().find(p => p.kind === "repeat");
    if (rep && n.kind === "field") DANS_REPET[n.name] = rep.name;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dateFr = d => d ? new Date(d + "T12:00").toLocaleDateString(locale(), { day: "numeric", month: "short", year: "numeric" }) : "";
const classe = p => p === "" || p == null || isNaN(p) ? "neutre" : p >= 80 ? "ok" : p >= 50 ? "alerte" : "critique";
let onglet = "accueil", page = 0, erreurs = {}, filtre = "toutes";

function rendre() {
  document.documentElement.lang = LANGUE;
  const enForm = onglet === "form";
  $("#nav").hidden = enForm;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("actif", b.dataset.onglet === onglet));
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  const n = fiches.filter(f => f.statut === "attente").length;
  $("#badge-sync").hidden = !n; $("#badge-sync").textContent = n;
  $("#pied").innerHTML = "";
  ({ accueil: ecranAccueil, supervisions: ecranSupervisions, activite: ecranActivite, rapport: ecranRapport, plan: ecranPlan, formulaire: ecranFormulaire, form: ecranForm })[onglet]();
}

function barre(titre, sous, opts = {}) {
  const langue = `<button class="langue" id="btn-langue" aria-label="${t("Changer de langue")}"><span class="${LANGUE === "fr" ? "on" : ""}">FR</span><span class="${LANGUE === "en" ? "on" : ""}">EN</span></button>`;
  $("#barre").innerHTML = `<div class="barre-ligne">${opts.gauche || ""}<div style="flex:1;min-width:0">${opts.sourcil ? `<div class="sourcil">${esc(opts.sourcil)}</div>` : ""}<h1>${esc(titre)}</h1>${sous ? `<div class="sous">${sous}</div>` : ""}</div>
    <div class="barre-droite">${langue}${opts.droite || `<button class="reseau ${enLigne ? "" : "hors"}" id="btn-reseau" title="${t("Simuler la perte de réseau")}"><span class="point"></span>${t(enLigne ? "En ligne" : "Hors ligne")}</button>`}</div></div>${opts.progression || ""}`;
  const r = $("#btn-reseau");
  if (r) r.onclick = () => { enLigne = !enLigne; sauver(); toast(t(enLigne ? "Réseau retrouvé : vous pouvez envoyer les fiches." : "Hors ligne : les fiches restent sur le téléphone.")); rendre(); };
  $("#btn-langue").onclick = () => { LANGUE = LANGUE === "fr" ? "en" : "fr"; ecrire("asbc_langue", LANGUE); const y = $("#ecran").scrollTop; rendre(); $("#ecran").scrollTop = y; };
}

function ligneFiche(f) {
  const r = f.resume;
  const st = f.statut === "brouillon" ? `<span class="pastille p-neutre">${t("Brouillon")}</span>` : f.statut === "attente" ? `<span class="pastille p-alerte">${t("À envoyer")}</span>` : `<span class="pastille p-ok">${t("Envoyée")}</span>`;
  const ini = (r.asbc || "?").replace(/^Exemple : /, "").split(/\s+/).filter(m => m.length > 2).map(m => m[0]).join("").slice(0, 2).toUpperCase();
  return `<button class="ligne" data-fiche="${f.id}"><div class="avatar">${esc(ini || "?")}</div><div class="corps"><div class="titre">${esc(nomAsbc(r.asbc) || t("ASBC non choisi"))}</div><div class="meta">${esc(dateFr(r.date))}${r.lieu ? " · " + esc(r.lieu) : ""}</div><div style="margin-top:3px">${st}</div></div><span class="score ${classe(r.pct)}">${r.pct === "" || r.pct == null ? "–" : r.pct + "%"}</span></button>`;
}

function ecranAccueil() {
  barre(t("Supervision des ASBC"), t("Niveau formation sanitaire (PSC, CSPS, CM)"));
  const finies = fiches.filter(f => f.statut !== "brouillon" && f.resume.pct !== "");
  const moy = finies.length ? Math.round(finies.reduce((s, f) => s + +f.resume.pct, 0) / finies.length) : "–";
  const attente = fiches.filter(f => f.statut === "attente").length;
  const brouillons = fiches.filter(f => f.statut === "brouillon");
  $("#ecran").innerHTML = `
    ${fiches.some(f => f.exemple) ? `<div class="exemple">${t("Les fiches marquées « Exemple » sont fictives. Les vôtres s'ajoutent à la liste.")}</div>` : ""}
    <div class="chiffres">
      <div class="chiffre"><b>${fiches.filter(f => f.statut !== "brouillon").length}</b><span>${t("fiches remplies")}</span></div>
      <div class="chiffre"><b>${moy}${moy === "–" ? "" : '<small style="font-size:15px">%</small>'}</b><span>${t("score global moyen")}</span></div>
      <div class="chiffre ${attente ? "attention" : ""}"><b>${attente}</b><span>${t("à envoyer")}</span></div>
    </div>

    ${attente ? `<button class="btn btn-bleu btn-large" id="envoyer">${tn(attente, "Envoyer {n} fiche au serveur", "Envoyer {n} fiches au serveur")}</button>` : ""}
    ${brouillons.length ? `<h2>${t("À terminer")}</h2><div class="liste">${brouillons.map(ligneFiche).join("")}</div>` : ""}
    <h2>${t("Dernières supervisions")}</h2>
    ${finies.length ? `<div class="liste">${finies.slice(0, 4).map(ligneFiche).join("")}</div>` : `<div class="carte vide">${t("Aucune fiche terminée.")}</div>`}
    <div class="liste"><button class="ligne" id="lien-form"><div class="avatar">i</div><div class="corps"><div class="titre">${t("Formulaire Kobo : contrôles et traduction")}</div><div class="meta">${esc((FORM.settings || {}).id_string || "")}</div></div><span aria-hidden="true">›</span></button></div>`;
  $("#nouvelle").onclick = () => nouvelle();

  if ($("#envoyer")) $("#envoyer").onclick = envoyer;

function ecranSupervisions() {
  const attente = fiches.filter(f => f.statut === "attente").length;
  barre(t("Supervisions"), attente ? tn(attente, "{n} fiche en attente d'envoi", "{n} fiches en attente d'envoi") : t("Tout est envoyé"));
  const l = fiches.filter(f => filtre === "toutes" || f.statut === filtre);

    ${attente ? `<button class="btn btn-bleu btn-large" id="envoyer">${t("Envoyer maintenant")}</button>` : ""}

function brancherFiches() { document.querySelectorAll("[data-fiche]").forEach(b => b.onclick = () => ouvrirFiche(b.dataset.fiche)); }

function ecranPlan() {
  const lignes = [];
  fiches.filter(f => f.statut !== "brouillon").forEach(f => (f.plan || []).forEach((p, i) => { if (p.Insuffisances || p.Recommandations_001) lignes.push({ f, p, k: f.id + ":" + i }); }));
  const ouvertes = lignes.filter(x => !suivi[x.k]).sort((a, b) => String(a.p._ch_ance || "9").localeCompare(String(b.p._ch_ance || "9")));
  const faites = lignes.filter(x => suivi[x.k]);
  barre(t("Plan de résolution"), tn(ouvertes.length, "{n} recommandation à suivre", "{n} recommandations à suivre"));
  const l = x => {
    const retard = !suivi[x.k] && x.p._ch_ance && x.p._ch_ance < jour();
    return `<label class="ligne" style="cursor:pointer;align-items:flex-start"><input type="checkbox" data-k="${x.k}" ${suivi[x.k] ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px">
      <div class="corps"><div class="titre" style="font-weight:500;${suivi[x.k] ? "text-decoration:line-through;color:var(--texte-2)" : ""}">${esc(x.p.Recommandations_001 || x.p.Insuffisances)}</div>
      ${x.p.Recommandations_001 && x.p.Insuffisances ? `<div class="meta">${t("Insuffisance : ")}${esc(x.p.Insuffisances)}</div>` : ""}
      <div class="meta">${esc(nomAsbc(x.f.resume.asbc))}${x.p.Responsable ? " · " + esc(x.p.Responsable) : ""}${x.p._ch_ance ? " · " + t("échéance") + " " + dateFr(x.p._ch_ance) : ""}</div></div>
      ${suivi[x.k] ? `<span class="pastille p-ok">${t("Réalisée")}</span>` : retard ? `<span class="pastille p-critique">${t("En retard")}</span>` : `<span class="pastille p-neutre">${t("Ouverte")}</span>`}</label>`;
  };
  $("#ecran").innerHTML = `<div class="indice">${t("Les lignes viennent du « Plan de résolution des problèmes » de chaque fiche. Cochez une recommandation quand elle est réalisée : le taux de réalisation de la prochaine supervision s'en servira.")}</div>
    <h2>${t("À suivre")}</h2>${ouvertes.length ? `<div class="liste">${ouvertes.map(l).join("")}</div>` : `<div class="carte vide">${t("Aucune recommandation ouverte.")}</div>`}
    <h2>${t("Réalisées")}</h2>${faites.length ? `<div class="liste">${faites.map(l).join("")}</div>` : `<div class="carte vide">${t("Rien pour le moment.")}</div>`}`;
  document.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { suivi[c.dataset.k] = c.checked; sauver(); rendre(); });
}

// Part des libellés du formulaire (hors listes géographiques) qui ont une traduction anglaise.
function couverture() {
  const geo = new Set(["region", "province", "district", "commune", "csps", "village", "asbc"]);
  const textes = new Set();
  FORM.survey.forEach(r => { if (r.label && r.type !== "calculate") textes.add(r.label); if (r.constraint_message) textes.add(r.constraint_message); });
  Object.entries(FORM.choices).forEach(([k, l]) => { if (!geo.has(k)) l.forEach(c => textes.add(c[1])); });
  const tous = [...textes];
  return { total: tous.length, faits: tous.filter(x => TRAD_FORM[x] != null).length };
}

function ecranFormulaire() {

  const questions = FORM.survey.filter(r => !["begin_group", "end_group", "begin_repeat", "end_repeat", "calculate", "note", "start", "end"].includes(r.type.split(" ")[0])).length;

      <dt>${t("ASBC dans la liste")}</dt><dd>${asbc.toLocaleString(locale())}</dd><dt>${t("Villages")}</dt><dd>${(FORM.choices.village || []).length.toLocaleString(locale())}</dd>
    </dl></div>
    <div class="indice">${t("L'application lit le XLSForm tel quel : groupes, conditions d'affichage (relevant), calculs, contraintes, listes en cascade (choice_filter) et répétitions.")}</div>
    <h2>${t("Traduction")}</h2>

      <div class="indice" style="margin-top:10px">${t("Les textes non traduits restent en français. Pour Kobo, build.py peut produire un XLSForm bilingue (colonnes label::English).")}</div>
      <pre class="json" style="margin:10px 0 0;max-height:none">python3 build.py formulaire.xlsx --xlsform-bilingue bilingue.xlsx</pre></div>
    <h2>${t("Contrôle du XLSForm")}</h2>
    <div class="carte">${ctr.length ? `<div class="indice" style="margin-bottom:6px">${t("{a} code(s) corrigé(s) dans le prototype, {b} à corriger dans Kobo.", { a: ctr.filter(c => c.corrige).length, b: ctr.filter(c => !c.corrige).length })}</div>` +
      ctr.map(c => `<div class="anomalie"><span class="pastille ${c.corrige ? "p-alerte" : "p-critique"}">${t(c.corrige ? "Corrigé ici" : "À corriger")}</span> ${t("Dans")} <code>${esc(c.dans)}</code>, ${c.message ? `<code>${esc(c.champ)}</code> : ${esc(LANGUE === "en" ? c.message.replace("sum() porte sur des codes non numériques", "sum() is applied to non-numeric codes").replace(" : le résultat est NaN.", ": the result is NaN.") : c.message)}` : `${t("la valeur")} <code>${esc(c.avant)}</code> ${t("n'existe pas pour")} <code>${esc(c.champ)}</code>${c.apres ? ` (${t("remplacée par")} <code>${esc(c.apres)}</code>)` : ""}.`}</div>`).join("") : t("Aucune anomalie détectée.")}
      ${ERREURS_EXPR.length ? ERREURS_EXPR.map(e => `<div class="anomalie"><span class="pastille p-critique">${t("Expression")}</span> ${esc(e)}</div>`).join("") : ""}</div>

    () => { $("#ok-reinit").onclick = () => { fiches = EXEMPLES.map(x => ({ ...x })); suivi = {}; sauver(); fermer(); toast(t("Fiches effacées.")); rendre(); }; });

/* ---------- Fiche existante ---------- */
function ouvrirFiche(id) {
  const f = fiches.find(x => x.id === id); const r = f.resume;
  if (f.statut === "brouillon" && !f.exemple) { inst = JSON.parse(JSON.stringify(f.inst)); page = f.page || 0; erreurs = {}; onglet = "form"; recalculer(); rendre(); return; }
  feuille(`<h3>${esc(nomAsbc(r.asbc))}</h3><div class="indice">${esc(dateFr(r.date))}${r.lieu ? " · " + esc(r.lieu) : ""}</div>
    ${blocResultat(r)}
    <div class="actions">${f.inst && f.statut !== "envoyee" ? `<button class="btn btn-contour" id="modifier">${t("Modifier")}</button>` : ""}${f.inst ? `<button class="btn btn-contour" id="voir-json">${t("Données")}</button>` : ""}<button class="btn btn-bleu" data-fermer>${t("Fermer")}</button></div>`, () => {
    if ($("#modifier")) $("#modifier").onclick = () => { fermer(); inst = JSON.parse(JSON.stringify(f.inst)); inst.id = f.id; page = 0; erreurs = {}; onglet = "form"; recalculer(); rendre(); };
    if ($("#voir-json")) $("#voir-json").onclick = () => voirJson(f.inst);
  });
}
function blocResultat(r) {
  return `<div class="resultat" style="margin-top:14px"><div style="font-size:14.5px;opacity:.85">${t("Score global ASBC")}</div><div class="grand">${r.pct === "" || r.pct == null ? "–" : r.pct + " %"}</div><div style="font-weight:600;margin-top:4px">${esc(tv(r.perf || ""))}</div><div class="barre-score"><i style="width:${Math.min(100, +r.pct || 0)}%"></i></div></div>
    ${r.sections && r.sections.length ? `<div class="sections-score" style="margin-top:14px">${r.sections.map(([n, p]) => `<div class="sec-score"><span>${esc(t(n))}</span><b class="score ${classe(p)}" style="font-size:15.5px">${p} %</b><div class="jauge"><i style="width:${Math.min(100, p)}%;background:var(--${classe(p) === "neutre" ? "texte-2" : classe(p)})"></i></div></div>`).join("")}</div>` : ""}`;
}
function voirJson(i) {
  const sortie = soumission(i);
  const txt = JSON.stringify(sortie, null, 2);
  feuille(`<h3>${t("Données de la fiche")}</h3><div class="indice" style="margin-bottom:8px">${t("Format proche d'une soumission Kobo (chemins de groupes). Les questions non pertinentes sont exclues.")}</div><pre class="json" id="json">${esc(txt)}</pre>
    <div class="actions"><button class="btn btn-contour" id="copier">${t("Copier")}</button><button class="btn btn-bleu" data-fermer>${t("Fermer")}</button></div>`, () => {
    $("#copier").onclick = () => navigator.clipboard.writeText(txt).then(() => toast(t("Données copiées.")), () => { const r = document.createRange(); r.selectNodeContents($("#json")); getSelection().removeAllRanges(); getSelection().addRange(r); toast(t("Sélectionnées : copiez avec le menu du téléphone.")); });
  });
}
function soumission(i) {
  const sauv = inst; inst = JSON.parse(JSON.stringify(i)); recalculer();
  const out = {};
  const chemin = n => { const p = []; let x = n.parent; while (x && x.kind !== "root") { if (x.kind !== "repeat") p.unshift(x.name); x = x.parent; } return p; };
  const ecrireCh = (n, v, base) => { if (estVide(v)) return; base[[...chemin(n), n.name].join("/")] = v; };
  const parcourir = (noeuds) => noeuds.forEach(n => {
    if (n.kind === "group") return parcourir(n.children);
    if (n.kind === "repeat") { out[n.name] = (inst.repets[n.name] || []).map((r, i) => { const o = {}; n.children.forEach(c => { if (c.kind === "field" && pertinent[cle(c.name, i)] !== false && c.base !== "note") ecrireCh(c, r[c.name], o); }); return o; }); return; }
    if (n.base === "note" || pertinent[n.name] === false) return;
    if (n.base === "draw" || n.appearance === "draw") return ecrireCh(n, inst.valeurs[n.name] ? "signature.png" : "", out);
    ecrireCh(n, inst.valeurs[n.name], out);
  });
  parcourir(racine.children);
  out["meta/instanceID"] = "uuid:" + i.id;
  inst = sauv; if (inst) recalculer();
  return out;
}

/* ---------- Saisie ---------- */
function nouvelle(prerempli) {
  inst = { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), valeurs: { start: new Date().toISOString(), ...(prerempli || {}) }, repets: {} };
  page = 0; erreurs = {}; onglet = "form"; recalculer(); rendre();
}
// Les données restent en français (codes et libellés du XLSForm) ; seule l'affichage est traduit.
function resume() {
  const v = inst.valeurs, lab = (n, c) => (CHOIX_INDEX[CHAMPS[n]?.liste] || {})[c] || "";
  const sections = [];
  const pc = (n, label) => { if (!estVide(v[n]) && pertinent[n] !== false) sections.push([label, +v[n]]); };
  const ch = String(v.supervision_choisie || "").split(" ");
  if (ch.includes("prise_en_charge")) pc("pct_global_pcime", "Prise en charge (PCIME)");
  if (ch.includes("promotion")) pc("pct_global_promotion", "Promotion de la santé");
  if (ch.includes("gestion_intrants")) pc("pct_global_gestion", "Gestion des intrants");
  return {
    asbc: v.Nom_et_pr_nom_de_l_ASBC || lab("asbc", v.asbc) || "", lieu: [lab("csps", v.csps), lab("district", v.district)].filter(Boolean).join(" · "),
    date: v.Date_de_la_supervision || (v.start || "").slice(0, 10), pct: ch[0] && !estVide(v.pct_global_total) ? +v.pct_global_total : "", perf: ch[0] ? v.performance_globale || "" : "", sections
  };
}
function enregistrerBrouillon() {
  const f = fiches.find(x => x.id === inst.id);
  const donnees = { id: inst.id, statut: "brouillon", inst: JSON.parse(JSON.stringify(inst)), resume: resume(), page };
  if (f) Object.assign(f, donnees); else fiches.unshift(donnees);
  sauver();
}
const titrePage = p => interpoler(p.titre);

function ecranForm() {
  recalculer();
  const pages = pagesActives();
  if (page >= pages.length) page = pages.length - 1;
  const pg = pages[page];
  const pct = inst.valeurs.supervision_choisie && !estVide(inst.valeurs.pct_global_total) ? inst.valeurs.pct_global_total : null;
  barre(titrePage(pg), t("Écran {a} sur {b}", { a: page + 1, b: pages.length }), {
    sourcil: tf(pg.sourcil), gauche: `<button class="icone-btn" id="quitter" aria-label="${t("Fermer la fiche")}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`,
    droite: pct != null ? `<div class="puce-score"><b>${pct} %</b>${t("score global")}</div>` : "",
    progression: `<div class="progression">${pages.map((_, i) => `<i class="${i < page ? "fait" : i === page ? "encours" : ""}"></i>`).join("")}</div>` });
  $("#quitter").onclick = () => feuille(`<h3>${t("Quitter la fiche ?")}</h3><div class="indice">${t("Vous pouvez la garder en brouillon et la reprendre plus tard.")}</div>

let derniereSig = "";
function signaturePage(pg) {

function html(n, idx, sansTitre) {

function poser(k, v) {

function signature(cv) {
  const k = cv.dataset.sig, ctx = cv.getContext("2d"), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = getComputedStyle(document.body).color;
  const v = valeur(k); if (v) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = v; }
  let actif = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { actif = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  cv.onpointermove = e => { if (actif) { ctx.lineTo(...pos(e)); ctx.stroke(); } };
  cv.onpointerup = () => { actif = false; poser(k, cv.toDataURL()); };
  const eff = document.querySelector(`[data-effacer="${k}"]`);
  if (eff) eff.onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); poser(k, ""); };
}

// Les erreurs sont gardées en français (clé) et traduites à l'affichage.
function erreursNoeuds(noeuds, idx, out) {
  for (const n of noeuds) {
    if (n.kind === "group") { if (pertinent[cle(n.name, idx)] !== false) erreursNoeuds(n.children, idx, out); continue; }
    if (n.kind === "repeat") { if (pertinent[n.name] !== false) (inst.repets[n.name] || []).forEach((_, i) => erreursNoeuds(n.children, i, out)); continue; }
    if (["note", "calculate", "start", "end"].includes(n.base)) continue;
    const k = cle(n.name, idx);
    if (pertinent[k] === false) continue;
    const v = valeur(k);
    if (n.required && estVide(v)) { out[k] = "Réponse obligatoire."; continue; }
    if (n.constraint && !estVide(v)) {
      const ok = bool(evaluer(n.constraint, contexte(idx, valeurTypee(n, v))));
      if (!ok) out[k] = n.constraint_message || "Réponse non valide.";
    }
  }
  return out;
}

/* =======================================================================
   8. eSanteCom : activité quotidienne des ASBC et rapport mensuel
   DONNÉES SIMULÉES. L'application réelle lira l'API eSanteCom ; ici un
   générateur déterministe (même date = mêmes chiffres) produit des données
   plausibles pour les ASBC des villages d'un CSPS de la liste du XLSForm.
   Les ASBC sont anonymisés (« ASBC 1 · village ») : aucun nom réel n'est

const L = (fr, en) => LANGUE === "en" ? en : fr;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const ZONE = (() => {
  const ch = FORM.choices, chercher = (liste, code) => (ch[liste] || []).find(c => c[0] === code);
  const cs = (ch.csps || []).find(c => /BAGASSI/i.test(c[1])) || (ch.csps || [])[0];
  if (!cs) return { asbc: [], chaine: {}, nom: "" };
  const commune = chercher("commune", cs[2]), district = commune && chercher("district", commune[2]);
  const province = district && chercher("province", district[2]), region = province && chercher("region", province[2]);
  const asbc = [];
  (ch.village || []).filter(v => v[2] === cs[0]).forEach(v => {
    const n = Math.min(2, Math.max(1, (ch.asbc || []).filter(a => a[2] === v[0]).length));
    for (let i = 1; i <= n; i++) asbc.push({ id: "ESC-" + (hash(v[0] + i) % 9000 + 1000), village: nomPropre(v[1]), villageCode: v[0] });
  });
  asbc.forEach((a, i) => {
    const r = alea(hash(a.id));
    a.num = i + 1; a.lambda = .9 + r() * 1.1; a.fiab = .88 + r() * .12;
    a.panne = i === 3;          // téléphone en panne : plus de synchronisation depuis 4 jours
    a.erreur = i === 5;         // rapport mensuel surestimé par rapport à eSanteCom
    a.oubli = i === 8;          // rapport mensuel incomplet (jours oubliés)
    a.rupture = i === 2 ? .45 : .02;

    chaine: { region: region?.[0], province: province?.[0], district: district?.[0], commune: commune?.[0], csps: cs[0] } };
})();
const nomAsbcEsc = a => L("ASBC", "CHW") + " " + a.num + " · " + a.village;

const THEMES = [["Utilisation de la moustiquaire", "Use of bed nets"], ["Allaitement maternel exclusif", "Exclusive breastfeeding"], ["Hygiène et lavage des mains", "Hygiene and handwashing"],
  ["Vaccination des enfants", "Child vaccination"], ["Nutrition du jeune enfant", "Young child nutrition"], ["Préparation à l'accouchement", "Birth preparedness"], ["Signes de danger chez la femme enceinte", "Danger signs in pregnancy"]];

const listeMois = () => Array.from({ length: 6 }, (_, i) => { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 1 - i); return x.toISOString().slice(0, 7); });
const joursDuMois = m => { const out = []; let d = m + "-01"; while (d.slice(0, 7) === m) { if (d <= jour()) out.push(d); d = decaler(d, 1); } return out; };
const nomMois = (m, court) => new Date(m + "-15T12:00").toLocaleDateString(locale(), court ? { month: "short" } : { month: "long", year: "numeric" });
const CACHE_M = {};
function rapportAsbc(a, m) {

  const r = alea(hash(cle + "rapport"));
  const esc_ = sommer(joursDuMois(m).filter(d => visible(a, d)).map(d => journee(a, d)));
  const declare = { ...esc_ };
  if (a.erreur) { declare.tdrpos = Math.round(esc_.tdrpos * 1.4 + 2); declare.cta = Math.round(esc_.cta * 1.3 + 1); }
  if (a.oubli) { declare.enfants = Math.round(esc_.enfants * .7); declare.pneumo = Math.round(esc_.pneumo * .7); declare.vad = Math.round(esc_.vad * .6); }

  const nonRecu = (a.panne && recentMois) || r() < .05;
  const jourRecu = 1 + Math.floor(Math.pow(r(), 1.8) * 9);
  const ecarts = CLES_CONTROLE.filter(k => Math.abs(declare[k] - esc_[k]) > Math.max(2, .1 * esc_[k]));
  return CACHE_M[cle] = { esc: esc_, declare, recu: nonRecu ? null : `${m}-${String(jourRecu).padStart(2, "0")}`, aTemps: !nonRecu && jourRecu <= 5, ecarts };
}
let etatRapports = lire("asbc_rapports", {});

      <path d="M${x},${bas} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + larg - 4} Q${x + larg},${y} ${x + larg},${y + 4} V${bas} Z" fill="var(--bleu)" opacity="${sel ? 1 : .45}"/>
      ${sel ? `<text x="${x + larg / 2}" y="${y - 6}" text-anchor="middle" class="g-val">${vals[i]}</text>` : ""}
      <text x="${i * pas + pas / 2}" y="${H - 6}" text-anchor="middle" class="g-axe">${esc(nomMois(m, true))}</text></g>`;
  }).join("");
  return `<div class="carte">
    <div class="filtres" style="margin-bottom:8px">${["enfants", "fe", "vg1", "nn1", "vad", "causerie"].map(k => { const i = IND_K.find(x => x.k === k); return `<button data-graph="${k}" class="${k === cle ? "sel" : ""}">${esc(L(i.fr, i.en))}</button>`; }).join("")}</div>
    <div class="indice" style="margin-bottom:4px">${esc(L(ind.fr, ind.en))} · ${L("tous les ASBC, d'après eSanteCom", "all CHWs, from eSanteCom")}</div>
    <svg viewBox="0 0 ${W} ${H}" class="graph" role="img" aria-label="${esc(L(ind.fr, ind.en))}"><line x1="0" x2="${W}" y1="${bas}" y2="${bas}" class="g-base"/>${barres}</svg>
    <div class="indice" id="g-info" style="min-height:1.4em">${L("Touchez une barre pour voir la valeur.", "Tap a bar to see its value.")}</div></div>`;
}

function ecranRapport() {
  const mois = listeMois(); if (!moisChoisi || !mois.includes(moisChoisi)) moisChoisi = mois[0];
  const m = moisChoisi, etat = etatMois(m);
  const raps = ZONE.asbc.map(a => ({ a, r: rapportAsbc(a, m) }));
  const recus = raps.filter(x => x.r.recu), aTemps = raps.filter(x => x.r.aTemps);
  const valid = x => etat.historique || etat.asbc[x.a.id] === "valide";
  const nValid = recus.filter(valid).length;
  const totD = sommer([]), totE = sommer([]);
  // Comparaison sur les mêmes ASBC (rapport reçu) ; l'activité des autres est indiquée à part.
  raps.forEach(x => IND_K.forEach(i => { if (x.r.recu) { totD[i.k] += x.r.declare[i.k]; totE[i.k] += x.r.esc[i.k]; } }));
  const sansRapport = raps.filter(x => !x.r.recu), enfantsSans = sansRapport.reduce((n, x) => n + x.r.esc.enfants, 0);
  const pc = (a, b) => b ? Math.round(100 * a / b) : 0;
  const statut = etat.transmis ? `<span class="pastille p-ok">${L("Transmis au district le ", "Sent to the district on ")}${dateFr(etat.transmis)}</span>` : `<span class="pastille p-alerte">${L("En cours de validation", "Being validated")}</span>`;
  barre(L("Rapport mensuel", "Monthly report"), `eSanteCom · ${esc(ZONE.nom)}`);
  $("#ecran").innerHTML = `
    <div class="exemple">${L("Données simulées. Déclaré : rapports mensuels envoyés par les ASBC. eSanteCom : somme des activités saisies chaque jour.", "Simulated data. Reported: monthly reports sent by CHWs. eSanteCom: sum of activities recorded each day.")}</div>
    <div class="filtres">${mois.map(x => `<button data-mois="${x}" class="${x === m ? "sel" : ""}">${esc(nomMois(x))}</button>`).join("")}</div>
    <div>${statut}</div>
    <div class="chiffres">
      ${tuile(pc(recus.length, raps.length) + "<small>%</small>", L(`complétude (${recus.length}/${raps.length})`, `completeness (${recus.length}/${raps.length})`), recus.length < raps.length)}
      ${tuile(pc(aTemps.length, raps.length) + "<small>%</small>", L("promptitude (avant le 5)", "timeliness (by the 5th)"), aTemps.length < raps.length)}
      ${tuile(`${nValid}<small>/${recus.length}</small>`, L("rapports validés", "reports validated"), nValid < recus.length)}
    </div>
    ${graphique(indicGraph)}
    <h2>${L("Indicateurs du CSPS", "Health centre indicators")}</h2>
    <div class="tableau"><table><thead><tr><th>${L("Indicateur", "Indicator")}</th><th class="n">${L("Déclaré", "Reported")}</th><th class="n">eSanteCom</th></tr></thead><tbody>
      ${INDICATEURS.map(i => i.g ? `<tr class="g"><td colspan="3">${esc(L(...i.g))}</td></tr>` : (() => {
        const e = Math.abs(totD[i.k] - totE[i.k]) > Math.max(3, .1 * totE[i.k]);
        return `<tr><td>${esc(L(i.fr, i.en))}</td><td class="n">${e ? `<span class="pastille p-alerte">${totD[i.k]}</span>` : totD[i.k]}</td><td class="n">${totE[i.k]}</td></tr>`;
      })()).join("")}
      <tr class="g"><td colspan="3">${L("Indicateurs calculés", "Calculated indicators")}</td></tr>
      <tr><td>${L("Taux de positivité TDR (< 5 ans)", "RDT positivity rate (< 5 years)")}</td><td class="n">${pc(totD.tdrpos, totD.tdr)} %</td><td class="n">${pc(totE.tdrpos, totE.tdr)} %</td></tr>
      <tr><td>${L("TDR positifs traités par CTA", "Positive RDTs treated with ACT")}</td><td class="n">${pc(totD.cta, totD.tdrpos)} %</td><td class="n">${pc(totE.cta, totE.tdrpos)} %</td></tr>
      <tr><td>${L("Grossesses enregistrées au 1er trimestre", "Pregnancies registered in the 1st trimester")}</td><td class="n">${pc(totD.fe1, totD.fe)} %</td><td class="n">${pc(totE.fe1, totE.fe)} %</td></tr>
    </tbody></table></div>
    <div class="indice">${L("Comparaison sur les ASBC qui ont envoyé leur rapport. Pastille orange : écart de plus de 10 %.", "Compared for CHWs who sent their report. Orange badge: difference over 10%.")}${sansRapport.length ? " " + L(`Les ${sansRapport.length} ASBC sans rapport ont pris en charge ${enfantsSans} enfant(s) d'après eSanteCom.`, `The ${sansRapport.length} CHW(s) without a report managed ${enfantsSans} child(ren) according to eSanteCom.`) : ""}</div>
    <h2>${L("Rapports des ASBC", "CHW reports")}</h2>
    <div class="liste">${raps.map(x => {
      const st = !x.r.recu ? `<span class="pastille p-critique">${L("Non reçu", "Not received")}</span>` : valid(x) ? `<span class="pastille p-ok">${L("Validé", "Validated")}</span>` : etat.asbc[x.a.id] === "renvoye" ? `<span class="pastille p-alerte">${L("Renvoyé", "Returned")}</span>` : `<span class="pastille p-neutre">${L("À valider", "To validate")}</span>`;
      const meta = x.r.recu ? L(`Reçu le ${dateFr(x.r.recu)} · ${x.r.aTemps ? "à temps" : "en retard"}`, `Received ${dateFr(x.r.recu)} · ${x.r.aTemps ? "on time" : "late"}`) : L("Pas de rapport pour ce mois", "No report for this month");
      return `<button class="ligne" data-rap="${x.a.id}"><div class="avatar">${x.a.num}</div><div class="corps"><div class="titre">${esc(nomAsbcEsc(x.a))}</div><div class="meta">${meta}</div><div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap">${st}${x.r.ecarts.length ? `<span class="pastille p-alerte">${L("Écart avec eSanteCom", "Differs from eSanteCom")}</span>` : ""}</div></div></button>`;
    }).join("")}</div>
    ${etat.transmis ? "" : `<button class="btn btn-plein btn-large" id="transmettre" ${nValid < recus.length ? "disabled" : ""}>${L("Transmettre le rapport au district", "Send the report to the district")}</button>
      <div class="indice">${nValid < recus.length ? L(`Validez d'abord les ${recus.length - nValid} rapport(s) reçu(s).`, `First validate the ${recus.length - nValid} report(s) received.`) : recus.length < raps.length ? L(`${raps.length - recus.length} rapport(s) manquant(s) seront signalés au district.`, `${raps.length - recus.length} missing report(s) will be flagged to the district.`) : L("Tous les rapports sont validés.", "All reports are validated.")}</div>`}`;
  document.querySelectorAll("[data-mois]").forEach(b => b.onclick = () => { moisChoisi = b.dataset.mois; rendre(); });
  document.querySelectorAll("[data-graph]").forEach(b => b.onclick = () => { indicGraph = b.dataset.graph; const y = $("#ecran").scrollTop; rendre(); $("#ecran").scrollTop = y; });
  document.querySelectorAll(".barre-g").forEach(g => { const f = () => { $("#g-info").textContent = g.dataset.info; }; g.onpointerenter = f; g.onclick = f; });
  document.querySelectorAll("[data-rap]").forEach(b => b.onclick = () => detailRapport(ZONE.asbc.find(a => a.id === b.dataset.rap), m));
  if ($("#transmettre")) $("#transmettre").onclick = () => feuille(`<h3>${L("Transmettre au district ?", "Send to the district?")}</h3><div class="indice">${L(`Rapport de ${ZONE.nom}, ${nomMois(m)} : ${recus.length} rapport(s) d'ASBC sur ${raps.length}.`, `${ZONE.nom} report, ${nomMois(m)}: ${recus.length} of ${raps.length} CHW reports.`)}</div>
    <div class="actions"><button class="btn btn-contour" data-fermer>${t("Annuler")}</button><button class="btn btn-plein" id="ok-trans">${L("Transmettre", "Send")}</button></div>`, () => {
    $("#ok-trans").onclick = () => { etat.transmis = jour(); etatRapports[m] = etat; ecrire("asbc_rapports", etatRapports); fermer(); toast(L("Rapport transmis au district (simulation).", "Report sent to the district (simulation).")); rendre(); };
  });
}

function detailRapport(a, m) {
  const r = rapportAsbc(a, m), etat = etatMois(m);
  const lignes = INDICATEURS.map(i => i.g ? `<tr class="g"><td colspan="3">${esc(L(...i.g))}</td></tr>` : (() => {
    const e = r.recu && Math.abs(r.declare[i.k] - r.esc[i.k]) > Math.max(2, .1 * r.esc[i.k]);
    return `<tr><td>${esc(L(i.fr, i.en))}</td><td class="n">${!r.recu ? "–" : e ? `<span class="pastille p-alerte">${r.declare[i.k]}</span>` : r.declare[i.k]}</td><td class="n">${r.esc[i.k]}</td></tr>`;
  })()).join("");
  const peutAgir = r.recu && !etat.transmis;
  feuille(`<h3>${esc(nomAsbcEsc(a))}</h3><div class="indice">${esc(nomMois(m))} · ${r.recu ? L("reçu le ", "received ") + dateFr(r.recu) : L("rapport non reçu", "report not received")}</div>
    ${r.ecarts.length ? `<div class="exemple" style="margin-top:10px">${L("Les chiffres déclarés diffèrent de plus de 10 % des activités saisies dans eSanteCom. Vérifiez le registre avec l'ASBC avant de valider.", "Reported figures differ by more than 10% from the activities recorded in eSanteCom. Check the register with the CHW before validating.")}</div>` : ""}
    <div class="tableau" style="margin-top:12px"><table><thead><tr><th>${L("Indicateur", "Indicator")}</th><th class="n">${L("Déclaré", "Reported")}</th><th class="n">eSanteCom</th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div class="actions">${peutAgir ? `<button class="btn btn-contour" id="renvoyer">${L("Renvoyer", "Return")}</button><button class="btn btn-bleu" id="valider">${L("Valider", "Validate")}</button>` : `<button class="btn btn-bleu" data-fermer>${t("Fermer")}</button>`}</div>`, () => {
    const poser_ = v => { etat.asbc[a.id] = v; etatRapports[m] = etat; ecrire("asbc_rapports", etatRapports); fermer(); toast(v === "valide" ? L("Rapport validé.", "Report validated.") : L("Rapport renvoyé à l'ASBC pour correction.", "Report returned to the CHW for correction.")); rendre(); };
    if ($("#valider")) $("#valider").onclick = () => poser_("valide");
    if ($("#renvoyer")) $("#renvoyer").onclick = () => poser_("renvoye");
  });
}

/* ---------- Feuilles et messages ---------- */
function feuille(contenu, apres, fermable = true) {
  $("#couche").innerHTML = `<div class="feuille" id="f"><div class="panneau gouttiere">${contenu}</div></div>`;
  if (fermable) $("#f").onclick = e => { if (e.target.id === "f" || e.target.closest("[data-fermer]")) fermer(); };
  if (apres) apres();
}
function fermer() { $("#couche").innerHTML = ""; }
let minuteur;
function toast(msg) {
  clearTimeout(minuteur); document.querySelectorAll(".toast").forEach(x => x.remove());
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = msg;
  $("#tel").appendChild(d); minuteur = setTimeout(() => d.remove(), 3500);
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { onglet = b.dataset.onglet; rendre(); });
// Compile toutes les expressions une fois pour signaler celles que le moteur ne sait pas lire.
FORM.survey.forEach(r => ["relevant", "calculation", "constraint", "choice_filter"].forEach(k => { if (r[k]) evaluer(r[k], { lire: () => "", attribut: () => "" }); }));
rendre();
</script>
